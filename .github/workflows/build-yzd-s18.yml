name: Build YZD-S18 Bookworm vendor image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified USB image and reports to Release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: yzd-s18-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 rsync parted gdisk             dosfstools e2fsprogs u-boot-tools device-tree-compiler kmod util-linux gzip gh
          df -h .
      - name: Run regressions including real busy loop cleanup
        run: sudo python3 -m unittest discover -s tests -v
      - name: Download locked inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/yzd-s18-inputs
          python3 - <<'PY' > build/input-downloads.tsv
          import json
          lock=json.load(open('scripts/yzd-s18/inputs.lock.json'))
          for name in lock['assets']:
              print(lock.get('asset_releases',{}).get(name,lock['release_tag']),name,sep='\t')
          PY
          while IFS=$'\t' read -r tag asset; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir build/yzd-s18-inputs
          done < build/input-downloads.tsv
          python3 scripts/yzd-s18/inputs.py verify build/yzd-s18-inputs scripts/yzd-s18/inputs.lock.json
      - name: Construct and validate image
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(python3 -c 'import json; print(json.load(open("scripts/yzd-s18/inputs.lock.json"))["kernel_bundle"])')"
          sudo ./rebuild -b yzd-s18 --custom-kernel-bundle "build/yzd-s18-inputs/$bundle"             --yzd-inputs-dir build/yzd-s18-inputs --output build/output/yzd-s18             2>&1 | tee build/yzd-s18-build.log
      - name: Validate preserved-U-Boot eMMC installer
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/yzd-s18/armbian-install
          test -x build/output/yzd-s18/armbian-install
          grep -q 'start_emmc_autoscript' build/output/yzd-s18/armbian-install
          ! grep -q 'mklabel' build/output/yzd-s18/armbian-install
          ! grep -q 'of="\$TARGET"' build/output/yzd-s18/armbian-install
          test -f build/output/yzd-s18/2026-10-10-yzd-s18-emmc-installer.md
      - name: Preserve validation and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yzd-s18-image-and-reports
          path: |
            build/output/yzd-s18/*
            build/yzd-s18-build.log
          if-no-files-found: warn
          retention-days: 14
      - name: Publish verified image
        if: success() && inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          out=build/output/yzd-s18
          python3 -c 'import json; assert json.load(open("build/output/yzd-s18/validation.json"))["status"]=="offline-validation-passed"'
          (cd "$out"; sha256sum -c ./*.img.gz.sha256)
          tag="yzd-s18-bookworm-$(date -u +%Y%m%d)-${GITHUB_SHA:0:8}-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$out"/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "YZD-S18 Bookworm / eMMC + raw IR USB profile" \
            --notes "USB server image with pinned 5.15.137-yzd-s18-peripherals, Mali r44p0 and vendor V4L2 video. New source-compiled DTS enables 8-bit/52MHz eMMC and meson-ir raw LIRC reception. Board opt-out disables automatic reserved key/DTB repairs; eMMC is read-only and ignored by desktop automount. Kernel boot, SSH, eMMC enumeration and raw IR device capabilities were verified on the existing USB installation. Physical remote pulses and booting this newly constructed image remain pending. This release does not claim eMMC flashing acceptance. See documents/yzd-s18-peripherals.md."
